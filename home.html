<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Gaming Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #00f2fe; --bg: #0a0a0c; --card: rgba(255,255,255,0.05); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: white; padding-bottom: 50px; }
        header { padding: 15px 20px; display: flex; justify-content: space-between; background: rgba(0,0,0,0.8); border-bottom: 1px solid var(--primary); position: sticky; top:0; z-index:100;}
        .slider { width: 95%; max-width: 800px; aspect-ratio: 16/9; margin: 20px auto; border-radius: 15px; overflow: hidden; position: relative; border: 1px solid var(--primary); }
        .slide { position: absolute; width:100%; height:100%; opacity:0; transition:0.8s; background-size:cover; background-position:center; }
        .slide.active { opacity:1; }
        .card { background: var(--card); margin: 20px auto; width: 90%; max-width: 800px; padding: 20px; border-radius: 15px; border: 1px solid #333; }
        .prize { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #222; }
        .btn-tg { display: block; text-align: center; padding: 15px; border-radius: 10px; text-decoration: none; font-weight: bold; margin: 10px auto; width: 90%; max-width: 800px; }
        .logout { color: red; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <div style="color: var(--primary); font-weight: 800;">GAMING PRO</div>
        <div class="logout" onclick="auth.signOut()">LOGOUT</div>
    </header>

    <div class="slider" id="topS"></div>

    <div class="card" style="text-align: center;">
        <h2>Welcome, <span id="uName" style="color: var(--primary);">Player</span></h2>
        <p>Total Players Registered: <span id="pCount">0</span></p>
    </div>

    <div class="card">
        <h3 style="text-align: center; margin-bottom: 15px;">TOURNAMENT DETAILS</h3>
        <div class="prize"><span>Entry Fee</span><span>FREE</span></div>
        <div class="prize"><span>Win Prize</span><span>1500 BDT</span></div>
        <div class="prize"><span>1st Place</span><span>800 BDT</span></div>
        <div class="prize"><span>2nd Place</span><span>500 BDT</span></div>
        <div class="prize"><span>3rd Place</span><span>200 BDT</span></div>
    </div>

    <a href="#" class="btn-tg" style="background: #0088cc; color: white;">TELEGRAM CHANNEL</a>

    <div class="slider" id="botS"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDbgxbAgvPBuykZzYmgcXLLln8iD6SV0G4",
            authDomain: "torunament-b06fc.firebaseapp.com",
            databaseURL: "https://torunament-b06fc-default-rtdb.firebaseio.com",
            projectId: "torunament-b06fc",
            storageBucket: "torunament-b06fc.firebasestorage.app",
            messagingSenderId: "659612602947",
            appId: "1:659612602947:web:6cc3e3a57d2fd798f37af6"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.database();

        auth.onAuthStateChanged(u => {
            if(!u) window.location.href="index.html";
            else {
                db.ref('users/' + u.uid).once('value', s => { if(s.val()) document.getElementById('uName').innerText = s.val().name; });
                db.ref('users').on('value', s => { document.getElementById('pCount').innerText = s.numChildren(); });
            }
        });

        // Banner System
        db.ref('banners').on('value', s => {
            const data = s.val();
            const top = document.getElementById('topS'), bot = document.getElementById('botS');
            top.innerHTML = ''; bot.innerHTML = '';
            if(data) {
                Object.values(data).forEach((url, i) => {
                    const active = i === 0 ? 'active' : '';
                    top.innerHTML += `<div class="slide ${active}" style="background-image:url('${url}')"></div>`;
                    bot.innerHTML += `<div class="slide ${active}" style="background-image:url('${url}')"></div>`;
                });
                startSlider();
            }
        });

        function startSlider() {
            setInterval(() => {
                const sliders = document.querySelectorAll('.slider');
                sliders.forEach(s => {
                    const slides = s.querySelectorAll('.slide');
                    if(slides.length < 2) return;
                    let curr = Array.from(slides).findIndex(sl => sl.classList.contains('active'));
                    slides[curr].classList.remove('active');
                    slides[(curr + 1) % slides.length].classList.add('active');
                });
            }, 5000);
        }
    </script>
</body>
</html>
