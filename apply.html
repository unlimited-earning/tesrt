<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE TOURNAMENT | Apply</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    
    <style>
        :root { --accent: #6c5ce7; --bg: #050505; --card: #121216; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Outfit', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .card { background: var(--card); padding: 30px; border-radius: 25px; width: 100%; max-width: 400px; border: 1px solid #222; text-align: center; }
        h2 { margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        input { width: 100%; padding: 15px; background: #000; border: 1px solid #333; border-radius: 12px; color: #fff; box-sizing: border-box; outline: none; }
        
        .btn { width: 100%; padding: 16px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-apply { background: var(--accent); color: white; }
        .btn-notice { background: #2ecc71; color: white; margin-top: 20px; text-decoration: none; display: block; }
        
        #detailsArea { display: none; }
        .success-icon { font-size: 50px; color: #2ecc71; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="card" id="formPanel">
    <h2><i class="fas fa-edit"></i> Tournament Apply</h2>
    <div class="input-group"><input type="text" id="gName" placeholder="Full Game Name"></div>
    <div class="input-group"><input type="text" id="gUid" placeholder="Game UID (Unique)"></div>
    <button class="btn btn-apply" onclick="submitApplication()">SUBMIT APPLICATION</button>
</div>

<div class="card" id="detailsArea">
    <div class="success-icon"><i class="fas fa-check-circle"></i></div>
    <h3>Application Successful!</h3>
    <p>Name: <span id="showName" style="color:var(--accent)"></span></p>
    <p>UID: <span id="showUid" style="color:var(--accent)"></span></p>
    <a href="notice.html" class="btn btn-notice">VIEW NOTICE BOARD</a>
    <a href="home.html" class="btn" style="background:#333">BACK TO HOME</a>
</div>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyB42lGhv-0M_kSIamswTodvRZSrrwgDXNA", 
        databaseURL: "https://ssbl-fc912-default-rtdb.firebaseio.com", 
        projectId: "ssbl-fc912" 
    };
    firebase.initializeApp(firebaseConfig);

    // এপ্লাই করার লজিক
    function submitApplication() {
        const user = firebase.auth().currentUser;
        if(!user) { alert("Please login first!"); window.location='index.html'; return; }
        
        const name = document.getElementById('gName').value;
        const uid = document.getElementById('gUid').value;

        if(!name || !uid) { alert("Please fill all fields!"); return; }

        firebase.database().ref('applications/' + user.uid).set({
            gameName: name,
            gameUid: uid,
            email: user.email
        }).then(() => location.reload());
    }

    // চেক করা ইউজার আগে এপ্লাই করেছে কিনা
    firebase.auth().onAuthStateChanged(user => {
        if(user) {
            firebase.database().ref('applications/' + user.uid).on('value', snap => {
                if(snap.exists()) {
                    document.getElementById('formPanel').style.display = 'none';
                    document.getElementById('detailsArea').style.display = 'block';
                    document.getElementById('showName').innerText = snap.val().gameName;
                    document.getElementById('showUid').innerText = snap.val().gameUid;
                }
            });
        }
    });
</script>
</body>
</html>
