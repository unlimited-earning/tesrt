<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tournament Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 flex items-center justify-center min-h-screen">
    <div class="bg-slate-900 border border-slate-800 p-10 rounded-3xl shadow-2xl w-full max-w-sm text-center">
        <h1 class="text-white text-3xl font-bold mb-2">Tournament</h1>
        <p class="text-slate-400 mb-8">Sign in to start your journey</p>
        <button id="loginBtn" class="w-full bg-white text-black font-bold py-4 rounded-xl hover:bg-slate-200 transition">
            Continue with Google
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAXIjn1NkBQXi_WFWTqCEyG74Q2FV9SAe8",
            authDomain: "singup-cd8a8.firebaseapp.com",
            projectId: "singup-cd8a8",
            storageBucket: "singup-cd8a8.firebasestorage.app",
            messagingSenderId: "744323487147",
            appId: "1:744323487147:web:a8aec9bce5d2efe9ed2eee"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth();
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        document.getElementById('loginBtn').onclick = () => {
            signInWithPopup(auth, provider).then(async (result) => {
                // ইউজার ডাটাবেসে সেভ করা
                const userRef = doc(db, "users", result.user.uid);
                await setDoc(userRef, { email: result.user.email }, { merge: true });
                window.location.href = "home.html";
            });
        };
    </script>
</body>
</html>
