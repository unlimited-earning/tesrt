<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament | Login & Register</title>
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --accent: #ff0055;
            --bg: #0a0a0c;
            --glass: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: var(--bg);
            color: white;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Animated Background */
        .bg-animate {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0a0a0c 100%);
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .form-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .tabs {
            display: flex;
            margin-bottom: 30px;
            background: rgba(0,0,0,0.3);
            padding: 5px;
            border-radius: 12px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
            font-weight: 600;
            color: #ccc;
        }

        .tab.active {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: #000;
        }

        .form-group { margin-bottom: 20px; position: relative; }
        .form-group i { position: absolute; left: 15px; top: 18px; color: var(--primary); }
        .form-group .toggle-pass { position: absolute; right: 15px; top: 18px; cursor: pointer; color: #888; }

        input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: white;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(0,242,254,0.2); }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: #000;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
        }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,242,254,0.4); }

        .loading-spinner {
            display: none;
            width: 20px; height: 20px;
            border: 3px solid rgba(0,0,0,0.3);
            border-top: 3px solid #000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .hidden { display: none; }

        /* Toast Notification */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background: #333;
            color: #fff;
            text-align: center;
            border-radius: 10px;
            padding: 16px;
            position: fixed;
            z-index: 1000;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
        }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }

        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

<div class="bg-animate"></div>
<div id="toast">Message goes here</div>

<div class="container">
    <div class="form-card">
        <h2 style="text-align: center; margin-bottom: 20px; letter-spacing: 2px;">GAMING <span style="color: var(--primary);">PRO</span></h2>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">LOGIN</div>
            <div class="tab" onclick="switchTab('register')">REGISTER</div>
        </div>

        <!-- Login Form -->
        <form id="loginForm">
            <div class="form-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="loginEmail" placeholder="Gmail Address" required>
            </div>
            <div class="form-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="loginPass" placeholder="Password" required>
                <i class="fa-solid fa-eye toggle-pass" onclick="togglePass('loginPass', this)"></i>
            </div>
            <div style="margin-bottom: 20px; font-size: 14px; display: flex; align-items: center;">
                <input type="checkbox" style="width: 18px; height: 18px; margin-right: 10px; cursor: pointer;"> Remember Me
            </div>
            <button type="submit" class="btn">
                <span class="btn-text">LOGIN NOW</span>
                <div class="loading-spinner"></div>
            </button>
        </form>

        <!-- Register Form -->
        <form id="registerForm" class="hidden">
            <div class="form-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="regName" placeholder="Full Name" required>
            </div>
            <div class="form-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="regEmail" placeholder="Gmail Address" required>
            </div>
            <div class="form-group">
                <i class="fa-solid fa-phone"></i>
                <input type="number" id="regPhone" placeholder="Mobile (11 Digits)" required>
            </div>
            <div class="form-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="regPass" placeholder="Password" required>
                <i class="fa-solid fa-eye toggle-pass" onclick="togglePass('regPass', this)"></i>
            </div>
            <div class="form-group">
                <i class="fa-solid fa-shield-halved"></i>
                <input type="password" id="regConfirmPass" placeholder="Confirm Password" required>
                <i class="fa-solid fa-eye toggle-pass" onclick="togglePass('regConfirmPass', this)"></i>
            </div>
            <button type="submit" class="btn">
                <span class="btn-text">CREATE ACCOUNT</span>
                <div class="loading-spinner"></div>
            </button>
        </form>
    </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.firebasestorage.app",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // Check if logged in
    auth.onAuthStateChanged(user => {
        if (user) window.location.href = "home.html";
    });

    // Toggle Tabs
    function switchTab(type) {
        const tabs = document.querySelectorAll('.tab');
        if(type === 'login') {
            tabs[0].classList.add('active');
            tabs[1].classList.remove('active');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('registerForm').classList.add('hidden');
        } else {
            tabs[1].classList.add('active');
            tabs[0].classList.remove('active');
            document.getElementById('registerForm').classList.remove('hidden');
            document.getElementById('loginForm').classList.add('hidden');
        }
    }

    // Show/Hide Password
    function togglePass(id, el) {
        const inp = document.getElementById(id);
        if(inp.type === 'password') {
            inp.type = 'text';
            el.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            inp.type = 'password';
            el.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }

    function showToast(msg) {
        const t = document.getElementById("toast");
        t.innerText = msg;
        t.className = "show";
        setTimeout(() => { t.className = t.className.replace("show", ""); }, 3000);
    }

    // Register Logic
    document.getElementById('registerForm').onsubmit = async (e) => {
        e.preventDefault();
        const name = document.getElementById('regName').value;
        const email = document.getElementById('regEmail').value;
        const phone = document.getElementById('regPhone').value;
        const pass = document.getElementById('regPass').value;
        const confirm = document.getElementById('regConfirmPass').value;

        if(phone.length !== 11) return showToast("Phone must be 11 digits");
        if(pass !== confirm) return showToast("Passwords do not match");

        const btn = e.target.querySelector('.btn');
        btn.querySelector('.btn-text').classList.add('hidden');
        btn.querySelector('.loading-spinner').style.display = 'block';

        try {
            const cred = await auth.createUserWithEmailAndPassword(email, pass);
            await db.ref('users/' + cred.user.uid).set({
                name, email, phone, password: pass, 
                createdAt: new Date().toISOString(),
                uid: cred.user.uid
            });
            showToast("Registration Successful!");
        } catch (err) {
            showToast(err.message);
        } finally {
            btn.querySelector('.btn-text').classList.remove('hidden');
            btn.querySelector('.loading-spinner').style.display = 'none';
        }
    };

    // Login Logic
    document.getElementById('loginForm').onsubmit = async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const pass = document.getElementById('loginPass').value;

        const btn = e.target.querySelector('.btn');
        btn.querySelector('.btn-text').classList.add('hidden');
        btn.querySelector('.loading-spinner').style.display = 'block';

        try {
            await auth.signInWithEmailAndPassword(email, pass);
            window.location.href = "home.html";
        } catch (err) {
            showToast("Invalid credentials");
        } finally {
            btn.querySelector('.btn-text').classList.remove('hidden');
            btn.querySelector('.loading-spinner').style.display = 'none';
        }
    };
</script>
</body>
</html>
