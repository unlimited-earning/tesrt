<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Pro | Login & Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #00f2fe; --secondary: #4facfe; --bg: #0a0a0c; --glass: rgba(255, 255, 255, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .bg-animate { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0a0a0c 100%); z-index: -1; }
        .form-card { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 25px; padding: 40px 30px; width: 90%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .tabs { display: flex; background: rgba(0,0,0,0.4); padding: 5px; border-radius: 15px; margin-bottom: 25px; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; border-radius: 12px; transition: 0.3s; font-weight: 600; color: #888; }
        .tab.active { background: linear-gradient(45deg, var(--primary), var(--secondary)); color: #000; }
        .form-group { margin-bottom: 15px; position: relative; }
        .form-group i { position: absolute; left: 15px; top: 16px; color: var(--primary); }
        .toggle-pass { position: absolute; right: 15px; top: 16px; cursor: pointer; color: #888; }
        input { width: 100%; padding: 14px 15px 14px 45px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; outline: none; }
        input:focus { border-color: var(--primary); }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; background: linear-gradient(45deg, var(--primary), var(--secondary)); color: #000; font-weight: 800; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .hidden { display: none; }
        #toast { visibility: hidden; min-width: 250px; background: #333; color: #fff; text-align: center; border-radius: 10px; padding: 16px; position: fixed; z-index: 1000; bottom: 30px; left: 50%; transform: translateX(-50%); border-left: 5px solid var(--primary); }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
        .loading { display: none; width: 20px; height: 20px; border: 3px solid rgba(0,0,0,0.2); border-top: 3px solid #000; border-radius: 50%; animation: spin 1s linear infinite; margin: auto; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="bg-animate"></div>
    <div id="toast">Message</div>
    <div class="form-card">
        <h2 style="text-align: center; margin-bottom: 20px;">GAMING <span style="color: var(--primary);">PRO</span></h2>
        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">LOGIN</div>
            <div class="tab" onclick="switchTab('register')">REGISTER</div>
        </div>
        <form id="loginForm">
            <div class="form-group"><i class="fa-solid fa-envelope"></i><input type="email" id="lEmail" placeholder="Gmail" required></div>
            <div class="form-group"><i class="fa-solid fa-lock"></i><input type="password" id="lPass" placeholder="Password" required><i class="fa-solid fa-eye toggle-pass" onclick="toggleP('lPass', this)"></i></div>
            <button type="submit" class="btn"><span class="txt">LOGIN</span><div class="loading"></div></button>
        </form>
        <form id="registerForm" class="hidden">
            <div class="form-group"><i class="fa-solid fa-user"></i><input type="text" id="rName" placeholder="Full Name" required></div>
            <div class="form-group"><i class="fa-solid fa-envelope"></i><input type="email" id="rEmail" placeholder="Gmail" required></div>
            <div class="form-group"><i class="fa-solid fa-phone"></i><input type="number" id="rPhone" placeholder="Mobile (11 Digits)" required></div>
            <div class="form-group"><i class="fa-solid fa-lock"></i><input type="password" id="rPass" placeholder="Password" required><i class="fa-solid fa-eye toggle-pass" onclick="toggleP('rPass', this)"></i></div>
            <button type="submit" class="btn"><span class="txt">REGISTER</span><div class="loading"></div></button>
        </form>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDbgxbAgvPBuykZzYmgcXLLln8iD6SV0G4",
            authDomain: "torunament-b06fc.firebaseapp.com",
            databaseURL: "https://torunament-b06fc-default-rtdb.firebaseio.com",
            projectId: "torunament-b06fc",
            storageBucket: "torunament-b06fc.firebasestorage.app",
            messagingSenderId: "659612602947",
            appId: "1:659612602947:web:6cc3e3a57d2fd798f37af6"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.database();

        auth.onAuthStateChanged(u => { if(u) window.location.href="home.html"; });

        function switchTab(t) {
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('loginForm').classList.toggle('hidden', t==='register');
            document.getElementById('registerForm').classList.toggle('hidden', t==='login');
        }

        function toggleP(id, el) {
            const i = document.getElementById(id);
            i.type = i.type === 'password' ? 'text' : 'password';
            el.classList.toggle('fa-eye'); el.classList.toggle('fa-eye-slash');
        }

        function showMsg(m) {
            const t = document.getElementById("toast");
            t.innerText = m; t.className = "show";
            setTimeout(() => t.className = "", 3000);
        }

        document.getElementById('registerForm').onsubmit = async (e) => {
            e.preventDefault();
            const n=document.getElementById('rName').value, em=document.getElementById('rEmail').value, 
                  ph=document.getElementById('rPhone').value, ps=document.getElementById('rPass').value;
            if(ph.length !== 11) return showMsg("Invalid Phone!");
            const b=e.target.querySelector('.btn'), l=b.querySelector('.loading'), tx=b.querySelector('.txt');
            tx.style.display='none'; l.style.display='block';
            try {
                const res = await auth.createUserWithEmailAndPassword(em, ps);
                await db.ref('users/' + res.user.uid).set({ name: n, email: em, phone: ph, password: ps, uid: res.user.uid });
                showMsg("Success!");
            } catch (err) { showMsg(err.message); }
            finally { tx.style.display='block'; l.style.display='none'; }
        };

        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            try {
                await auth.signInWithEmailAndPassword(document.getElementById('lEmail').value, document.getElementById('lPass').value);
                window.location.href="home.html";
            } catch (err) { showMsg("Login Failed!"); }
        };
    </script>
</body>
</html>
