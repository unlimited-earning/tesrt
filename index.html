<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Login</title>
    <!-- Tailwind CSS for Premium Design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="glass w-full max-w-sm p-8 rounded-3xl shadow-2xl text-center text-white">
        <h2 class="text-3xl font-bold mb-2">Login</h2>
        <p class="text-gray-400 mb-8">Access your dashboard</p>
        
        <button id="googleBtn" class="w-full bg-white text-gray-900 font-bold py-3 rounded-xl hover:bg-gray-100 transition duration-300 flex items-center justify-center gap-2">
            <span>Sign in with Google</span>
        </button>
        
        <div id="errorBox" class="mt-4 text-red-400 text-sm"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // আপনার Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAXIjn1NkBQXi_WFWTqCEyG74Q2FV9SAe8",
            authDomain: "singup-cd8a8.firebaseapp.com",
            projectId: "singup-cd8a8",
            storageBucket: "singup-cd8a8.firebasestorage.app",
            messagingSenderId: "744323487147",
            appId: "1:744323487147:web:a8aec9bce5d2efe9ed2eee"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth();
        const provider = new GoogleAuthProvider();

        const btn = document.getElementById('googleBtn');
        const errorBox = document.getElementById('errorBox');

        btn.addEventListener('click', () => {
            btn.innerText = "Processing...";
            signInWithPopup(auth, provider)
                .then((result) => {
                    // লগইন সফল হলে home.html এ নিয়ে যাবে
                    window.location.href = "home.html";
                })
                .catch((error) => {
                    btn.innerText = "Sign in with Google";
                    errorBox.innerText = "Error: " + error.message;
                    console.error(error);
                });
        });
    </script>
</body>
</html>
