<!DOCTYPE html>
<html lang="en">
<head>
    <title>Tournament Notices</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { background: #0f0f12; color: #fff; font-family: 'Outfit', sans-serif; padding: 20px; }
        .back-btn { display: inline-flex; align-items: center; gap: 10px; color: #6c5ce7; text-decoration: none; margin-bottom: 25px; }
        
        .notice-card { 
            background: #18181d; 
            padding: 25px; 
            margin-bottom: 20px; 
            border-radius: 15px; 
            border-left: 5px solid #6c5ce7; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            /* এই লাইনটিই আপনার সমস্যার সমাধান */
            white-space: pre-wrap; 
            line-height: 1.6;
            font-size: 16px;
        }
        h2 { text-align: center; color: #fff; }
    </style>
</head>
<body>

    <a href="home.html" class="back-btn">← Back to Home</a>
    <h2>Tournament Notices</h2>
    <div id="noticeList"></div>

    <script>
        firebase.initializeApp({apiKey: "AIzaSyB42lGhv-0M_kSIamswTodvRZSrrwgDXNA", databaseURL: "https://ssbl-fc912-default-rtdb.firebaseio.com", projectId: "ssbl-fc912"});
        
        firebase.database().ref('notices').on('value', snap => {
            const list = document.getElementById('noticeList');
            list.innerHTML = "";
            snap.forEach(child => {
                const notice = child.val();
                list.innerHTML += `
                    <div class="notice-card">
                        <small style="color:#6c5ce7; font-weight:bold;">${notice.date}</small>
                        <p style="margin-top:10px;">${notice.content}</p>
                    </div>`;
            });
        });
    </script>
</body>
</html>
